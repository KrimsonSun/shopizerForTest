name: Yu-Chien Shopping Cart CI

on:
  push:
    branches: [ "master", "main", "3.2.7" ]
  pull_request:
    branches: [ "master", "main", "3.2.7" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # FIX: Make mvnw executable (prevents "permission denied" exit code 1)
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run My Shopping Cart Tests
        run: ./mvnw -B -pl sm-core -am -Dtest=MyCartCoverageTest -DfailIfNoTests=false test

      # FIX: Use pmd:pmd to generate the HTML site report, THEN pmd:check to check violations
      - name: Run PMD Analysis
        run: ./mvnw -B -pl sm-core -am pmd:pmd pmd:check -Dpmd.failOnViolation=false

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: |
            **/target/site/pmd.html
            **/target/pmd.xml

  analyze:
    name: Analyze Code Quality (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # FIX: Make mvnw executable here too
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          # FIX: Explicitly set build-mode to stop the "undefined" warning
          build-mode: none

      - name: Build (skip tests) for CodeQL
        run: ./mvnw -B -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
