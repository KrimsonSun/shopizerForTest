name: Yu-Chien Shopping Cart CI

on:
  push:
    branches: [ "master", "main", "3.2.7" ]
  pull_request:
    branches: [ "master", "main", "3.2.7" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run My Shopping Cart Tests
        run: ./mvnw -B -pl sm-core -am -Dtest=MyCartCoverageTest -DfailIfNoTests=false test

      # Create a minimal Maven settings that only uses Maven Central (no spring-releases)
      - name: Create Maven settings for SpotBugs
        run: |
          cat > /tmp/spotbugs-settings.xml << 'SETTINGS'
          <settings>
            <mirrors>
              <mirror>
                <id>central-only</id>
                <mirrorOf>*</mirrorOf>
                <url>https://repo.maven.apache.org/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS

      - name: Run SpotBugs Analysis
        run: ./mvnw -B -pl sm-core -am -s /tmp/spotbugs-settings.xml com.github.spotbugs:spotbugs-maven-plugin:4.7.3.6:spotbugs -Dspotbugs.failOnError=false
        continue-on-error: true

      - name: Find SpotBugs output (debug)
        if: always()
        run: find . -name "spotbugsXml.xml" 2>/dev/null || echo "No SpotBugs XML found"

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: "**/target/spotbugsXml.xml"
          if-no-files-found: warn

  analyze:
    name: Analyze Code Quality (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build for CodeQL
        run: ./mvnw -B -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
