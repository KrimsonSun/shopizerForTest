name: Yu-Chien Shopping Cart CI

on:
  push:
    branches: [ "master", "main", "3.2.7" ]
  pull_request:
    branches: [ "master", "main", "3.2.7" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run My Shopping Cart Tests
        run: ./mvnw -B -pl sm-core -am -Dtest=MyCartCoverageTest -DfailIfNoTests=false test

      # SpotBugs is already in your pom.xml — just run it!
      - name: Run SpotBugs Analysis
        run: ./mvnw -B -pl sm-core -am spotbugs:spotbugs
        continue-on-error: true

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: sm-core/target/spotbugsXml.xml
          if-no-files-found: warn

  analyze:
    name: Analyze Code Quality (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # Upgraded to v4 to remove deprecation warning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build for CodeQL
        run: ./mvnw -B -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
